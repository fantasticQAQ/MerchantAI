# AI 助手的独立部署编排。
#
# 它**不包含**商家后台的业务服务（identity / merchant / payment / sqlserver / rabbitmq）——
# 那些已经独立部署在云上，AI 通过网关地址访问它们（见 .env 里的 MERCHANT_BASE_URL）。
# 这里只跑两样东西：AI 后端 + 前端，外加一个给 AI 自己用的 Redis。
#
# 用法见同目录 README.md；日常操作直接用 deploy.ps1。

services:
  # AI 自己的 Redis：存会话历史、待确认操作、审计轨迹。
  # 和业务侧的 Redis **不是同一个** —— AI 的会话数据不该混进业务库。
  ai-redis:
    image: redis:7-alpine
    container_name: ai-redis
    # appendonly：审计轨迹要求永久保留，不能只放在内存里
    # requirepass：端口已对外暴露，必须有密码兜底
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    ports:
      - "6380:6379"
    volumes:
      - ai_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - ai-network
    restart: unless-stopped

  ai-api:
    build:
      context: .
      dockerfile: src/MerchantAI.API/Dockerfile
    image: merchant-admin-ai-api:${IMAGE_TAG:-latest}
    container_name: ai-api
    environment:
      # ---- 云上业务服务（经 Nginx 网关）----
      - IdentityApi__BaseUrl=${IDENTITY_BASE_URL}
      - MerchantApi__BaseUrl=${MERCHANT_BASE_URL}
      - MerchantApi__GatewayPrefix=${MERCHANT_GATEWAY_PREFIX}
      - MerchantApi__ServiceToken=${MERCHANT_SERVICE_TOKEN}
      # 服务账号：后端用它自动续期业务 token。缺了这两个，
      # token 过期后所有工具调用会集体 401（启动日志会告警）。
      - MerchantApi__ServiceAccount__UserName=${SERVICE_USER}
      - MerchantApi__ServiceAccount__Password=${SERVICE_PASSWORD}

      # ---- JWT 校验（必须和云上 Identity 实际签出来的 iss 一致）----
      - Jwt__Issuer=${JWT_ISSUER}
      - Jwt__Key=${JWT_KEY}

      # ---- 模型 ----
      - DeepSeek__ApiKey=${DEEPSEEK_API_KEY}
      - DeepSeek__Endpoint=${DEEPSEEK_ENDPOINT:-https://api.deepseek.com/v1}
      - DeepSeek__ModelId=${DEEPSEEK_MODEL:-deepseek-chat}

      # ---- AI 自己的 Redis ----
      - Ai__Redis__ConnectionString=${REDIS_CONNECTION:-ai-redis:6379,abortConnect=false}

      # 允许被反代访问
      - Cors__AllowedOrigins__0=${PUBLIC_ORIGIN:-http://localhost:8090}
    depends_on:
      ai-redis:
        condition: service_healthy
    # 刻意不挂载 .swagger-cache.json。
    # 它在 .gitignore 里（被当成运行时产物），服务器上很可能不存在；而 Docker 遇到
    # 不存在的 bind 源会**创建一个同名目录**，后端读它时直接启动失败，且报错很难指向这里。
    # 这份缓存已经 COPY 进镜像了，更新它 = 重新构建（.\deploy.ps1 up）。
    networks:
      - ai-network
    restart: unless-stopped

  ai-frontend:
    build:
      context: ./src/MerchantAI.Frontend
    image: merchant-admin-ai-frontend:${IMAGE_TAG:-latest}
    container_name: ai-frontend
    # 唯一的对外入口：静态资源 + /api/ 与 /mcp 反代到 ai-api
    ports:
      - "${HTTP_PORT:-8090}:80"
    depends_on:
      ai-api:
        condition: service_started
    networks:
      - ai-network
    restart: unless-stopped

networks:
  ai-network:
    name: ai-network
    driver: bridge

volumes:
  ai_redis_data:
