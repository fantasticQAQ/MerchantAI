events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    # 批量任务会跑很久（「建 1000 个商品」实测十几分钟），
    # nginx 默认 60 秒就把连接掐了，表现为前端报「网络错误」而 AI 其实还在干活。
    proxy_connect_timeout 30s;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;

    # 5100 只是本地 dotnet run 的端口（launchSettings）。容器里由 Dockerfile 的
    # ASPNETCORE_URLS=http://+:8080 固定成 8080，写错了会整站 502。
    # 只有真带 Upgrade 头的请求才走 upgrade，其余走 keepalive。
    # 无条件写死 "upgrade" 会给普通 API 请求也带上一个没有 Upgrade 的 Connection 头。
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream ai_backend {
        server ai-api:8080;
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size 8m;

        # 前端静态资源。Vue Router 用 history 模式，找不到的路径一律回 index.html
        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        # AI 后端接口
        location /api/ {
            proxy_pass http://ai_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            # 长任务期间不要缓冲，也早点把响应推出去
            proxy_buffering off;
        }

        # MCP 端点（Streamable HTTP）
        location /mcp {
            proxy_pass http://ai_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
        }
    }
}
